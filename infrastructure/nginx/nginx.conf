# =============================================================================
# Nginx Configuration - StreamServer
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # -------------------------------------------------------------------------
    # Gzip
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # -------------------------------------------------------------------------
    # Rate Limiting
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=stream_conn:10m;

    # -------------------------------------------------------------------------
    # DDoS Protection
    # -------------------------------------------------------------------------
    limit_req_status 429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Upstreams
    # -------------------------------------------------------------------------
    upstream backend_api {
        server backend:3000;
        keepalive 32;
    }

    upstream icecast_server {
        server icecast:8000;
        keepalive 64;
    }

    upstream dashboard_app {
        server dashboard:80;
    }

    # -------------------------------------------------------------------------
    # HTTP Server (redirect to HTTPS in production)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # In production, uncomment below to redirect to HTTPS:
        # return 301 https://$server_name$request_uri;

        include /etc/nginx/conf.d/locations.conf;
    }

    # -------------------------------------------------------------------------
    # HTTPS Server (uncomment in production)
    # -------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name radio.example.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/radio.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     include /etc/nginx/conf.d/locations.conf;
    # }
}
