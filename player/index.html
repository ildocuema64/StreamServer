<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamServer Player</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        background: #0a0e1a;
        color: #f1f5f9;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(680px, calc(100vw - 32px));
        background: #111827;
        border: 1px solid #1e293b;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 14px; color: #94a3b8; font-size: 13px; line-height: 1.4; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      input {
        flex: 1;
        min-width: 220px;
        background: #0f1525;
        border: 1px solid #1e293b;
        color: #f1f5f9;
        padding: 10px 12px;
        border-radius: 10px;
      }
      button {
        background: #6366f1;
        color: white;
        border: 0;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      .meta { margin-top: 12px; font-size: 13px; color: #a5b4fc; }
      audio { width: 100%; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>StreamServer Player</h1>
      <p>
        Por defeito aponta para <code>/stream/live</code> (proxy do Nginx para o Icecast).
        Se usares outro mount, altera aqui.
      </p>

      <div class="row">
        <input id="url" value="/stream/live" />
        <button id="play">Tocar</button>
        <button id="stop" style="background:#ef4444;">Parar</button>
      </div>

      <div class="meta" id="status">Pronto.</div>
      <audio id="audio" controls preload="none"></audio>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const audio = $("audio");
      const url = $("url");
      const status = $("status");

      function setStatus(msg) { status.textContent = msg; }

      $("play").addEventListener("click", async () => {
        audio.src = url.value.trim() || "/stream/live";
        try {
          await audio.play();
          setStatus("A tocar: " + audio.src);
        } catch (e) {
          setStatus("Falha ao tocar (o stream está online?): " + (e?.message || "erro"));
        }
      });

      $("stop").addEventListener("click", () => {
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        setStatus("Parado.");
      });
    </script>
  </body>
</html>
