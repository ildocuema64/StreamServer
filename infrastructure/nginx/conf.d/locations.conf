# =============================================================================
# Nginx Location Blocks - StreamServer
# =============================================================================

# -------------------------------------------------------------------------
# Stream Endpoints (Icecast Proxy)
# -------------------------------------------------------------------------
location /stream/ {
    proxy_pass http://icecast_server/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming-specific settings
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ICY metadata support
    proxy_set_header Icy-MetaData $http_icy_metadata;
    proxy_pass_header Icy-MetaData;
    proxy_pass_header Ice-Audio-Info;
    proxy_pass_header Content-Type;

    # Connection limits per IP for streams
    limit_conn stream_conn 10;

    # CORS for web player
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, X-Requested-With, Content-Type, Icy-MetaData" always;

    # Timeouts for long-lived connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# -------------------------------------------------------------------------
# API Backend
# -------------------------------------------------------------------------
location /api/ {
    limit_req zone=api burst=50 nodelay;

    proxy_pass http://backend_api/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 300s;
}

# API Auth (stricter rate limiting)
location /api/auth/login {
    limit_req zone=login burst=3 nodelay;

    proxy_pass http://backend_api/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API Upload (rate limited)
location /api/upload {
    limit_req zone=upload burst=5 nodelay;
    client_max_body_size 500M;

    proxy_pass http://backend_api/api/upload;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# -------------------------------------------------------------------------
# WebSocket
# -------------------------------------------------------------------------
location /ws {
    proxy_pass http://backend_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
}

# -------------------------------------------------------------------------
# Admin Dashboard
# -------------------------------------------------------------------------
location /admin/ {
    proxy_pass http://dashboard_app/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache static assets
    location ~* /admin/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://dashboard_app;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# -------------------------------------------------------------------------
# Web Player
# -------------------------------------------------------------------------
location /player {
    alias /usr/share/nginx/html/player;
    index index.html;
    try_files $uri $uri/ /player/index.html;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# -------------------------------------------------------------------------
# Public API (for mobile apps)
# -------------------------------------------------------------------------
location /api/public/ {
    limit_req zone=api burst=100 nodelay;

    proxy_pass http://backend_api/api/public/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS for mobile apps
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}

# -------------------------------------------------------------------------
# Health Check
# -------------------------------------------------------------------------
location /health {
    proxy_pass http://backend_api/api/health;
    access_log off;
}

# -------------------------------------------------------------------------
# Root
# -------------------------------------------------------------------------
location / {
    return 301 /player;
}
